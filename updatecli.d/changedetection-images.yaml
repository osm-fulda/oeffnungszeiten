---
name: "Update the container images"

# Run with `updatecli pipeline diff --config updatecli.d/`; .github/workflows/updatecli.yml runs
# `apply` weekly and hands the result to a branch and an issue.

sources:
  changedetection:
    name: "Get latest changedetection.io version tag"
    kind: dockerimage
    spec:
      image: "ghcr.io/dgtlmoon/changedetection.io"
      versionFilter:
        kind: "semver"
        pattern: "*"

  # sockpuppetbrowser has no usable semver stream: :latest is newer than its highest version
  # tag (0.0.3), so tracking the version would roll the browser BACKWARDS. Track the digest
  # of :latest instead — a bump is then a visible one-line diff rather than a silent pull.
  sockpuppetbrowser:
    name: "Get current sockpuppetbrowser :latest digest"
    kind: dockerdigest
    spec:
      image: "dgtlmoon/sockpuppetbrowser"
      tag: "latest"
    # The source answers "latest@sha256:…"; the chart holds the bare digest and adds the "@".
    transformers:
      - trimprefix: "latest@"

# The chart pins the images; appVersion and the docker line in FILTERS.md only name the version,
# but a bump that leaves them behind makes the next reader believe the older one still runs.
#
# Every target is a regex on the file, not a yaml target. The yaml engines rewrite the document:
# the default one drops the quotes (an unquoted 0.71 is a float, and the image tag breaks), and
# yamlpath keeps them but deletes every blank line. A regex changes the value and nothing else.
targets:
  chart-changedetection-tag:
    name: "chart: image.tag"
    kind: file
    sourceid: changedetection
    spec:
      file: "charts/changedetection/values.yaml"
      matchpattern: '(repository: ghcr\.io/dgtlmoon/changedetection\.io\n\s+tag: )"[^"]*"'
      replacepattern: '${1}"{{ source "changedetection" }}"'

  chart-appversion:
    name: "chart: appVersion"
    kind: file
    sourceid: changedetection
    spec:
      file: "charts/changedetection/Chart.yaml"
      matchpattern: 'appVersion: "[^"]*"'
      replacepattern: 'appVersion: "{{ source "changedetection" }}"'

  filters-docker-line:
    name: "FILTERS.md: docker run example"
    kind: file
    sourceid: changedetection
    spec:
      file: "FILTERS.md"
      matchpattern: 'changedetection\.io:[0-9][0-9.]*'
      replacepattern: 'changedetection.io:{{ source "changedetection" }}'

  chart-browser-digest:
    name: "chart: browser.image.digest"
    kind: file
    sourceid: sockpuppetbrowser
    spec:
      file: "charts/changedetection/values.yaml"
      # The only digest with a value: image.digest for changedetection itself is "".
      matchpattern: 'digest: "sha256:[0-9a-f]{64}"'
      replacepattern: 'digest: "{{ source "sockpuppetbrowser" }}"'
