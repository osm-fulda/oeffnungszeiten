# "/pick N" under a wizard issue -> branch, entry file, pull request.
#
# Same split as wizard.yml: the job that fetches the page holds no write token, and hands its
# result to the job that pushes.
#
# Two gates, and both are needed. The label says a maintainer decided this thread is worth a
# runner — but the label sits on the issue, while the comment that starts the run may come from
# anyone who can type. A passer-by writing `/pick 1` under a labeled issue would otherwise fetch
# a page and force-push a branch on our account, as often as they care to.
#
# The commenter therefore has to be either one of us or the person who opened the issue. The
# second half is the point of the whole path: the contributor who proposed the page picks the
# block that carries the hours, with no fork and nothing installed, exactly as the README
# describes. What a third party would add is not a contribution, only a runner.
#
# `concurrency` caps the rest: a second `/pick` in the same thread replaces the first instead of
# queueing behind it, so a stuck fetch cannot pile up either.
name: wizard-pick

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: wizard-pick-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  emit:
    if: >
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.event.issue.user.login ||
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association)) &&
      (contains(github.event.issue.labels.*.name, 'wizard') ||
       contains(github.event.issue.labels.*.name, 'filter-fix')) &&
      startsWith(github.event.comment.body, '/pick')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet lxml
      - name: issue and comment, as files
        env:
          BODY: ${{ github.event.issue.body }}
          PICK: ${{ github.event.comment.body }}
        run: |
          printf '%s' "$BODY" > body.md
          printf '%s' "$PICK" > pick.md
      - name: build the entry
        continue-on-error: true          # a refusal is an answer and still has a comment to post
        env:
          FIX: ${{ contains(github.event.issue.labels.*.name, 'filter-fix') && '--fix' || '' }}
        run: |
          PYTHONPATH=scripts python3 scripts/wizard_bot.py emit $FIX \
            --body-file body.md --comment-file pick.md \
            --issue "${{ github.event.issue.number }}" --out out
      - name: the entry has to survive the same check as any other
        run: |
          if [ -f out/meta.json ]; then
            cp out/entry/*.json entries/
            # A page whose block-list record was due gets that record removed in the same
            # commit; a page may sit in only one of the two lists, and this check enforces it.
            # Written as an if, not `[ -f … ] && cp`: under `bash -e` a false test would end
            # the step, so the ordinary case would fail.
            if [ -f out/no-watch.json ]; then cp out/no-watch.json no-watch.json; fi
            python3 scripts/validate_entries.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wizard-entry
          path: out
          retention-days: 7

  pull-request:
    needs: emit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # A pull request opened with GITHUB_TOKEN starts no further workflow, which is GitHub's
      # guard against a loop. The entry check therefore already ran in the emit job above. Put a
      # PAT in WIZARD_PR_TOKEN and the pull request also gets its own CI run, with no change here.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.WIZARD_PR_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: wizard-entry
          path: out
      - name: nothing to open
        id: refused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f out/meta.json ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" --body-file out/comment.md
            echo "stop=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: branch, commit, pull request
        if: steps.refused.outputs.stop != 'yes'
        env:
          GH_TOKEN: ${{ secrets.WIZARD_PR_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          BRANCH=$(python3 -c "import json;print(json.load(open('out/meta.json'))['branch'])")
          TITLE=$(python3 -c "import json;print(json.load(open('out/meta.json'))['title'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          cp out/entry/*.json entries/
          if [ -f out/no-watch.json ]; then cp out/no-watch.json no-watch.json; fi
          git add entries/ no-watch.json
          git commit -m "$TITLE"
          git push --force origin "HEAD:$BRANCH"
          URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')
          # "GitHub Actions is not permitted to create or approve pull requests" is a repository
          # setting, off by default. Rather than depend on it, fall back to a link that opens the
          # form filled in — which a person then submits, and their pull request runs CI.
          if [ -z "$URL" ]; then
            URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" \
                    --body-file out/pr-body.md) || URL=""
          fi
          if [ -n "$URL" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" \
              --body "Pull Request steht: $URL. Lies dort noch einmal, was der Filter fängt — was hier im Issue steht, war der Abruf von vorhin."
          else
            python3 scripts/wizard_bot.py compare --repo "$REPO" --branch "$BRANCH" \
              --title "$TITLE" --body-file out/pr-body.md --out out
            gh issue comment "$ISSUE" --repo "$REPO" --body-file out/compare.md
          fi
