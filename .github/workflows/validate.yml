name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  entries:
    # Structure only, and deliberately so: stdlib, no network, 60 ms for every entry. It catches
    # what breaks the reconcile — invalid JSON, a missing url, a duplicate slug, an unsupported
    # fetch_backend, an absolute XPath that dies on the next site edit, a missing captured_sample.
    #
    # Whether a filter really captures the hours needs the live page, and that check fails for
    # reasons a contributor cannot fix: the site is down, blocks bots, or rate-limits the runner.
    # A red build nobody caused is a build everybody learns to ignore. That judgement stays with
    # the reviewer, who reads captured_sample in the diff.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_entries.py
      # The prune guard decides whether an hourly job may delete watches. Small enough to hold in
      # the docstring, important enough that CI runs the examples.
      - run: python3 -m doctest scripts/entries_sync.py
      # wizard_bot reads what a stranger typed into an issue form. Its parsing and validation
      # half is stdlib and needs no network, exactly so it can be checked in this job.
      - run: PYTHONPATH=scripts python3 -m doctest scripts/wizard_bot.py
      # The bot finds a field by its heading, and the heading GitHub renders is the form's
      # `label`. Renaming one therefore breaks the parsing in silence: the issue looks right and
      # the bot reads an empty URL. One pass over the forms says whether every heading it knows
      # still exists somewhere.
      - name: every heading the bot reads still exists in a form
        run: |
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "scripts")
          from wizard_bot import FIELDS
          labels = set()
          for f in sorted(pathlib.Path(".github/ISSUE_TEMPLATE").glob("*.yml")):
              for line in f.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if line.startswith("label:"):
                      labels.add(line[len("label:"):].strip().strip("\"'"))
          missing = sorted(set(FIELDS) - labels)
          if missing:
              sys.exit(f"no issue form carries these headings any more: {missing}")
          print(f"{len(FIELDS)} headings, all present")
          PY

  settings-in-sync:
    # deploy/global-settings.json is the source. apps/changedetection/global-settings.values.yaml
    # is generated from it and becomes a ConfigMap through the kustomization, so there is no copy
    # to keep in sync any more — only the generated file, which must match its source. A lost
    # noise-suppression pattern shows up as false alerts weeks later, so check it on every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: generated values match deploy/global-settings.json
        run: |
          python3 scripts/apply_global_settings.py --emit-values
          git diff --exit-code -- apps/changedetection/global-settings.values.yaml || {
            echo "The generated values are stale. Regenerate and commit:"
            echo "  python3 scripts/apply_global_settings.py --emit-values"
            exit 1
          }
      - name: the ConfigMap the cluster gets carries exactly those settings
        run: |
          pip install --quiet pyyaml
          kubectl kustomize apps/changedetection > /tmp/built.yaml
          python3 - <<'PY'
          import json, sys, yaml
          src = json.load(open("deploy/global-settings.json"))
          cm = [d for d in yaml.safe_load_all(open("/tmp/built.yaml"))
                if d and d["kind"] == "ConfigMap"
                and d["metadata"]["name"] == "changedetection-global-settings-values"][0]
          got = yaml.safe_load(cm["data"]["values.yaml"])["globalSettings"]
          if got != src:
              sys.exit("the built ConfigMap and deploy/global-settings.json disagree")
          print(f"in sync — {len(src['application']['global_ignore_text'])} ignore patterns")
          PY

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: the action's default follows "latest", which crossed the 3.x -> 4.x boundary
      # mid-PR and broke `helm plugin install` twice in opposite directions.
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - run: helm lint ./charts/changedetection
      - name: relay source compiles and formats a message
        # files/matrix_relay.py ships as ConfigMap data, so nothing else would notice a syntax
        # error until the relay crash-loops in the cluster. format_message carries doctests for
        # the shapes that reach the room, the line cap among them.
        run: |
          python3 -m py_compile charts/changedetection/files/matrix_relay.py
          python3 -m doctest charts/changedetection/files/matrix_relay.py
      - name: unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
          helm unittest charts/changedetection
      - name: renders with the real values the cluster gets
        # Both ConfigMaps, in the order the HelmRelease merges them, and built the way Flux
        # builds them — otherwise this renders a combination that never exists in the cluster.
        run: |
          pip install --quiet pyyaml
          kubectl kustomize apps/changedetection > /tmp/built.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/built.yaml")) if d]
          for name, out in [("changedetection-base-values", "/tmp/base-values.yaml"),
                            ("changedetection-global-settings-values", "/tmp/settings.yaml")]:
              cm = [d for d in docs
                    if d["kind"] == "ConfigMap" and d["metadata"]["name"] == name][0]
              open(out, "w").write(cm["data"]["values.yaml"])
          PY
          helm template changedetection ./charts/changedetection \
            --namespace changedetection -f /tmp/base-values.yaml -f /tmp/settings.yaml > /dev/null

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kustomize builds
        run: |
          kubectl kustomize apps/changedetection > /dev/null
          python3 -c "import yaml,sys; list(yaml.safe_load_all(open('clusters/k8s02/apps.yaml')))"
